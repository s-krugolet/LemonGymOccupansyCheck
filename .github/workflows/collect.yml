name: collect-occupancy            # имя, которое видно во вкладке Actions

on:                                # КОГДА запускать
  workflow_dispatch:               # плюс кнопка «Run workflow» для ручного запуска

permissions:
  contents: write                  # разрешаем workflow сохранять файлы обратно в репозиторий

concurrency:                       # если предыдущий запуск ещё идёт, новый ждёт
  group: collect
  cancel-in-progress: false

jobs:                              # ЧТО делать
  collect:
    runs-on: ubuntu-latest         # временная машина с Linux
    steps:
      - uses: actions/checkout@v5          # 1. скачать код репозитория на машину
      - uses: actions/setup-python@v6      # 2. установить Python
        with:
          python-version: "3.12"
      - run: python collect.py             # 3. сделать замер и дописать строки в CSV
      - name: Commit data                  # 4. сохранить обновлённый CSV в репозиторий
        run: |
          git config user.name "occupancy-bot"
          git config user.email "occupancy-bot@users.noreply.github.com"
          git add data/occupancy.csv
          git diff --cached --quiet || git commit -m "data: $(date -u +%FT%TZ)"
          git pull --rebase && git push
